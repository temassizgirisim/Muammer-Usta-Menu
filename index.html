<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Ödeme | Temassız Girişim</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #111;
            text-align: center;
        }
        p.subtitle {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .card {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .label-small {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .value {
            font-size: 15px;
            font-weight: 600;
            color: #111;
            word-break: break-all;
        }
        .iban-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border: 1px solid #ddd;
            padding: 8px 10px;
            border-radius: 8px;
            margin-top: 4px;
        }
        .iban-text {
            font-family: monospace;
            font-size: 13px;
            font-weight: 700;
            color: #000;
        }
        .copy-btn {
            background: #34c759;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .copy-btn.copied {
            background: #248a3d;
        }
        .select-btn {
            display: block;
            width: 100%;
            background: #007aff;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .select-btn:hover {
            background: #0056b3;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding: 10px 0 0 0;
        }
    </style>
</head>
<body>

    <div class="container" id="appContainer">
        <!-- İçerik JavaScript ile dinamik yüklenecek -->
    </div>

    <script>
        const kullanicilar = {
            "zilan": {
                name: "Zilan Üstündağ",
                iban: "TR86 0001 0090 1011 3243 4050 01"
            },
            "ismail": {
                name: "Muhammet İsmail Kılıç",
                iban: "TR54 0015 7000 0000 0204 8311 36"
            }
        };

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const u = params.get('u');
            const container = document.getElementById('appContainer');

            if (u) {
                const cleanKey = u.toLowerCase().trim();
                if (kullanicilar[cleanKey]) {
                    // Kullanıcı bulunduysa ödeme ekranını göster
                    container.innerHTML = `
                        <h2 id="clientTitle">@${cleanKey}</h2>
                        <p class="subtitle">Ödeme için IBAN'ı kopyalayabilirsiniz</p>
                        
                        <div class="card">
                            <div class="label-small">Alıcı Ad Soyad</div>
                            <div class="value" id="resName">${kullanicilar[cleanKey].name}</div>
                        </div>
                        
                        <div class="card">
                            <div class="label-small">IBAN Numarası</div>
                            <div class="iban-row">
                                <span class="iban-text" id="resIban">${kullanicilar[cleanKey].iban}</span>
                                <button class="copy-btn" onclick="copyIban()">Kopyala</button>
                            </div>
                        </div>
                        <div class="footer">Temassız Girişim Altyapısı</div>
                    `;
                    return;
                }
            }
            
            // Eğer parametre yoksa veya kullanıcı adı yanlışsa seçim ekranı göster
            container.innerHTML = `
                <h2>Ödeme Ekranı</h2>
                <p class="subtitle">Lütfen işlem yapmak istediğiniz hesabı seçin:</p>
                <a href="?u=zilan" class="select-btn">Zilan Üstündağ Ödeme Ekranı</a>
                <a href="?u=ismail" class="select-btn">Muhammet İsmail Kılıç Ödeme Ekranı</a>
                <div class="footer">Temassız Girişim Altyapısı</div>
            `;
        };

        function copyIban() {
            const iban = document.getElementById('resIban').innerText;
            const btn = document.querySelector('.copy-btn');
            if (!iban || iban === '-') return;
            
            navigator.clipboard.writeText(iban).then(() => {
                btn.innerText = "Kopyalandı!";
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerText = "Kopyala";
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
</body>
</html>
