<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMASSIZ GİRİŞİM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af, #515bd4);
            background-size: 400% 400%;
            animation: gradientAnim 10s ease infinite;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        @keyframes gradientAnim {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #ffffff;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 14px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.3);
        }
        .iban-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 18px;
            padding: 20px;
            margin-top: 25px;
            text-align: left;
        }
        .iban-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #f3e8ff;
            font-weight: 500;
        }
        .iban-number {
            font-family: monospace;
            font-size: 16px;
            letter-spacing: 1px;
            color: #ffffff;
            word-break: break-all;
            font-weight: 600;
        }
        .copy-btn {
            background: #ffffff;
            color: #8134af;
            border: none;
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .copy-btn:active {
            transform: scale(0.95);
            background: #f3e8ff;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <h1>TEMASSIZ GİRİŞİM</h1>

        <a href="#" class="btn" onclick="vCardIndir(); return false;">
            <span>👤 Rehbere Kaydet</span>
        </a>

        <a href="https://wa.me/905000000000" class="btn" target="_blank">
            <span>💬 WhatsApp</span>
        </a>

        <a href="tel:+905000000000" class="btn">
            <span>📞 Ara</span>
        </a>

        <a href="https://instagram.com" class="btn" target="_blank">
            <span>📸 Instagram</span>
        </a>

        <div class="iban-box">
            <div class="iban-header">
                <span>Banka Hesabı (IBAN)</span>
                <span>Leman Tekin</span>
            </div>
            <div class="iban-number">TR17 0006 4000 0011 2330 6886 40</div>
            <div style="text-align: right; margin-top: 12px;">
                <button class="copy-btn" onclick="ibanKopyala()">Kopyala</button>
            </div>
        </div>
    </div>

    <script>
        function ibanKopyala() {
            navigator.clipboard.writeText("TR170006400000112330688640");
            alert("IBAN kopyalandı!");
        }

        function vCardIndir() {
            const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:Temassız Girişim\nTEL:+905000000000\nEND:VCARD";
            const blob = new Blob([vcard], { type: "text/vcard" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "temassiz-girisim.vcf";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>

</body>
</html>
