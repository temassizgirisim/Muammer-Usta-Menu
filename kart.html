<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hızlı Ödeme | Temassız Girişim</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #111;
            text-align: center;
        }
        p.subtitle {
            font-size: 13px;
            color: #666;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .card {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .label-small {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .row-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border: 1px solid #ddd;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 4px;
        }
        .text-value {
            font-size: 14px;
            font-weight: 600;
            color: #111;
            word-break: break-all;
        }
        .iban-font {
            font-family: monospace;
            font-size: 13px;
            font-weight: 700;
        }
        .copy-btn {
            background: #34c759;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 8px;
            transition: background 0.2s;
        }
        .copy-btn.copied {
            background: #248a3d;
        }
        .btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            margin-top: 8px;
        }
        .btn:hover {
            background: #0056b3;
        }
        input.form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        input.form-input:focus {
            border-color: #007aff;
        }
        .result-box {
            background: #eef6ff;
            border: 1px solid #bce0fd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            word-break: break-all;
            font-size: 12px;
            color: #004085;
            font-family: monospace;
        }
        .footer {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #007aff;
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container" id="app"></div>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const nameParam = params.get('name');
            const ibanParam = params.get('iban');
            const app = document.getElementById('app');

            if (nameParam && ibanParam) {
                // MÜŞTERİ ÖDEME EKRANI (NFC Okutulduğunda Açılacak)
                const decodedName = decodeURIComponent(nameParam);
                const decodedIban = decodeURIComponent(ibanParam);

                app.innerHTML = `
                    <h2>Hızlı Ödeme</h2>
                    <p class="subtitle">Ödeme için alıcı adı veya IBAN'ı tek tıkla kopyalayabilirsiniz.</p>
                    
                    <div class="card">
                        <div class="label-small">Alıcı Ad Soyad</div>
                        <div class="row-content">
                            <span class="text-value" id="nameText">${escapeHtml(decodedName)}</span>
                            <button class="copy-btn" id="copyNameBtn" onclick="copyText('nameText', 'copyNameBtn')">Kopyala</button>
                        </div>
                    </div>
                    
                    <div class="card">
                        <div class="label-small">IBAN Numarası</div>
                        <div class="row-content">
                            <span class="text-value iban-font" id="ibanText">${escapeHtml(decodedIban)}</span>
                            <button class="copy-btn" id="copyIbanBtn" onclick="copyText('ibanText', 'copyIbanBtn')">Kopyala</button>
                        </div>
                    </div>

                    <a href="${window.location.origin + window.location.pathname}" class="back-link">Yeni Kart İçin Link Oluştur</a>
                    <div class="footer">Temassız Girişim Altyapısı</div>
                `;
            } else {
                // LİNK OLUŞTURMA PANELİ (Senin Kartı Programlamadan Önce Açacağın Sayfa)
                app.innerHTML = `
                    <h2>NFC Kart Link Sihirbazı</h2>
                    <p class="subtitle">Bilgileri girin, NFC karta yazılacak özel linki hemen oluşturun.</p>
                    
                    <div class="label-small">Alıcı Ad Soyad</div>
                    <input type="text" id="inputName" class="form-input" placeholder="Örn: Ahmet Yılmaz">
                    
                    <div class="label-small">IBAN Numarası</div>
                    <input type="text" id="inputIban" class="form-input" placeholder="Örn: TR86 0001 ...">
                    
                    <button class="btn" onclick="generateLink()">Link Oluştur ve Kopyala</button>

                    <div id="outputArea" style="display:none;">
                        <div class="result-box" id="generatedLinkText"></div>
                        <button class="btn" style="background:#34c759; margin-top: 8px;" onclick="copyGeneratedLink()">Oluşturulan Linki Tekrar Kopyala</button>
                    </div>

                    <div class="footer">Temassız Girişim Altyapısı</div>
                `;
            }
        };

        function generateLink() {
            const name = document.getElementById('inputName').value.trim();
            const iban = document.getElementById('inputIban').value.trim();

            if (!name || !iban) {
                alert('Lütfen alıcı ad soyad ve IBAN alanlarını doldurun!');
                return;
            }

            const baseUrl = window.location.origin + window.location.pathname;
            const finalLink = `${baseUrl}?name=${encodeURIComponent(name)}&iban=${encodeURIComponent(iban)}`;

            document.getElementById('outputArea').style.display = 'block';
            document.getElementById('generatedLinkText').innerText = finalLink;

            copyToClipboard(finalLink, function() {
                alert('Link kopyalandı! Şimdi bunu NFC kartınıza yazabilirsiniz.');
            });
        }

        function copyGeneratedLink() {
            const linkText = document.getElementById('generatedLinkText').innerText;
            copyToClipboard(linkText, function() {
                alert('Link tekrar kopyalandı!');
            });
        }

        function copyText(elementId, buttonId) {
            const text = document.getElementById(elementId).innerText;
            const btn = document.getElementById(buttonId);
            
            copyToClipboard(text, function() {
                const originalText = btn.innerText;
                btn.innerText = "Kopyalandı!";
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function copyToClipboard(text, successCallback) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(successCallback).catch(() => {
                    fallbackCopy(text, successCallback);
                });
            } else {
                fallbackCopy(text, successCallback);
            }
        }

        function fallbackCopy(text, successCallback) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) successCallback();
                else alert('Kopyalama başarısız oldu.');
            } catch (err) {
                alert('Kopyalama desteklenmiyor.');
            }
            document.body.removeChild(textArea);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/[']/g, "&#039;");
        }
    </script>
</body>
</html>
